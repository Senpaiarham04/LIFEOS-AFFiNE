name: Build Custom AFFiNE Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (default: latest)'
        required: false
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: personal/toggle-feature

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable --inline-builds
        env:
          HUSKY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          SENTRYCLI_SKIP_DOWNLOAD: '1'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu-@affine/server-native

      - name: Build server native (Rust)
        run: yarn workspace @affine/server-native build --target x86_64-unknown-linux-gnu
        env:
          DEBUG: 'napi:*'
          CC: 'clang -D_BSD_SOURCE'

      - name: Rename server native binary
        run: mv ./packages/backend/native/server-native.node ./packages/backend/native/server-native.x64.node

      - name: Build web frontend
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: 'canary'

      - name: Build admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: 'canary'

      - name: Build mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: 'canary'

      - name: Build server
        run: yarn workspace @affine/server build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install production deps and generate Prisma client
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production
          yarn workspace @affine/server prisma generate
          mv ./node_modules ./packages/backend/server

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          provenance: false
          file: .github/deployment/node/Dockerfile
          tags: |
            ghcr.io/senpaiarham04/affine-custom:${{ github.event.inputs.tag || 'latest' }}
            ghcr.io/senpaiarham04/affine-custom:${{ github.sha }}
