name: Release All (Docker + Desktop + Android)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.26.3-toggle.1)'
        required: true
        type: string
      branch:
        description: 'Branch to build from'
        required: true
        default: personal/dev
        type: string

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  BUILD_TYPE: canary

jobs:
  # ── Build shared deps (once, used by all) ──
  setup:
    runs-on: ubuntu-22.04
    outputs:
      git_sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
      - name: Get short SHA
        id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

  # ── Docker Image ──
  docker:
    needs: setup
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable --inline-builds
        env:
          HUSKY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          SENTRYCLI_SKIP_DOWNLOAD: '1'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: x86_64-unknown-linux-gnu-@affine/server-native
      - name: Build server native (Rust)
        run: yarn workspace @affine/server-native build --target x86_64-unknown-linux-gnu
        env:
          CC: 'clang -D_BSD_SOURCE'

      - name: Prepare native binaries for bundler
        run: |
          for arch in x64 arm64 armv7; do
            cp -f packages/backend/native/server-native.node packages/backend/native/server-native.$arch.node
          done

      - name: Build web frontend
        run: yarn affine @affine/web build
        env:
          BUILD_TYPE: canary
      - name: Build admin
        run: yarn affine @affine/admin build
        env:
          BUILD_TYPE: canary
      - name: Build mobile
        run: yarn affine @affine/mobile build
        env:
          BUILD_TYPE: canary
      - name: Build server
        run: yarn workspace @affine/server build

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install production deps and Prisma
        run: |
          yarn config set --json supportedArchitectures.cpu '["x64"]'
          yarn config set --json supportedArchitectures.libc '["glibc"]'
          yarn workspaces focus @affine/server --production
          yarn workspace @affine/server prisma generate
          mv ./node_modules ./packages/backend/server

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          platforms: linux/amd64
          provenance: false
          file: .github/deployment/node/Dockerfile
          tags: |
            ghcr.io/${{ github.repository }}/affine-custom:${{ inputs.tag }}
            ghcr.io/${{ github.repository }}/affine-custom:${{ needs.setup.outputs.git_sha }}

  # ── Desktop (Windows x64) ──
  desktop:
    needs: setup
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
      - name: Enable Corepack
        run: corepack enable

      - name: Set versions in package.json
        run: |
          VER="${{ inputs.tag }}"
          VER="${VER#v}"
          node -e "
            const fs = require('fs');
            ['package.json', 'packages/frontend/apps/electron/package.json'].forEach(p => {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf-8'));
              pkg.version = '$VER';
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2));
            });
          "
          echo "Version set to $VER"

      - name: Install dependencies
        run: yarn install --immutable --inline-builds
        env:
          HUSKY: '0'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          SENTRYCLI_SKIP_DOWNLOAD: '1'

      - name: Generate electron assets
        run: yarn affine @affine/electron generate-assets

      - name: Build Desktop
        run: yarn affine @affine/electron build
        env:
          HOIST_NODE_MODULES: '1'

      - name: Package (electron-forge)
        run: yarn affine @affine/electron package --platform=win32 --arch=x64
        env:
          HOIST_NODE_MODULES: '1'

      - name: Make Squirrel Installer
        run: yarn affine @affine/electron make-squirrel --platform=win32 --arch=x64
        env:
          HOIST_NODE_MODULES: '1'

      - name: Find and rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "*.exe" packages/frontend/apps/electron/out/ | Select-Object -First 1
          if ($exe) {
            Copy-Item $exe.FullName AFFiNE-LifeOS-Setup-${{ inputs.tag }}-win32-x64.exe
            Write-Host "Found: $($exe.FullName) ($($exe.Length) bytes)"
          } else {
            Write-Host "No exe found"
            dir -Recurse packages/frontend/apps/electron/out/ | Select-Object -First 30
          }

      - name: Upload Desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: affine-desktop-win32-x64
          path: AFFiNE-LifeOS-*.exe
          if-no-files-found: warn

